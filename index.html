<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <style>
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Body ka design yahan hai */
        .page-body {
            background-image: url('back.png');
            background-size: cover;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            /* Content ko center karne ke liye */
            align-items: center;
            height: 95vh;
            font-weight: 600;
            margin: 0;
            /* Default margin hatane ke liye taaki scroll bar na aaye */
        }

        /* Form ka design yahan hai */
        .order-form {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            width: 350px;
            height: 80%;
            border: 0.3px solid #0a09097e;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* 'top' ki jagah sahi flexbox property use ki hai */
            background-color: #b8b0b051;
            box-shadow: 0 2px 5px rgba(1, 0, 0, 0.5);
            backdrop-filter: blur(15px);
        }


        /* Text/Labels ke liye thodi spacing */
        .form-label {
            margin-top: 7px;

        }

        .form-separator {
            width: 100%;
            height: 0.5px;
            border: none;
            background-color: #ad6d6d;
            margin: 5px 0;

        }

        .sub {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .sub:hover {
            background-color: #45a049;
        }

        .sub:active {
            background-color: #2b23c5cd;
        }

        .form-input {
            width: 70%;
            margin: 10px;
            padding: 10px;
            box-sizing: border-box;
            border: 1.8px solid #b8b0b06a;
            border-radius: 5px;
            transition: 0.4s;
            outline: none;
        }

        .form-input:focus {
            border-color: green;
            box-shadow: 0 0 8px rgba(23, 12, 236, 0.605);

        }
    </style>
</head>

<body class="page-body">

    <form method="post" class="order-form">

        <label class="form-label" for="item1">Mobile No.</label>
        <input type="tel" maxlength="10" pattern="[0-9]{10}" id="item4" name="mobile_no" class="form-input"
            placeholder="Enter your Mobile No.">

        <hr class="form-separator">

        <label for="Payment_Type:" class="form-label">Payment Type</label>
        <select type="Payment_Type" id="item2" name="Payment_type" class="form-input" required>
            <option value="" selected>Select Payment Type</option>
            <option value="Cash on Delivery">Cash on Delivery</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="UPI">UPI</option>
            <option value="Net Banking">Net Banking</option>
        </select>

        <hr class="form-separator">

        <label class="form-label" for="item3" id="item2">Cancellation History</label>
        <input type="number" id="item2" name="cancellation_history" class="form-input"
            placeholder="Enter Cancellation History">

        <hr class="form-separator">

        <label class="form-label" for="item4">Order Amount</label>
        <input type="number" id="item3" name="order_amount" class="form-input" placeholder="Enter Order Amount">

        <hr class="form-separator">

        <label class="form-label" for="city" id="item5">Enter your City</label>
        <select type=" City" name="City" class="form-input" required>
            <option value="" selected>Select City</option>
            <option value="Metro City">Metro City</option>
            <option value="Urban">Urban</option>
            <option value="Rural">Rural</option>
        </select>

        <hr class="form-separator">

        <input type="button" value="Submit" class="sub">

    </form>
</body>

</html>
