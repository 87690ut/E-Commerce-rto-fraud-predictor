<!DOCTYPE html>

<head>
    <title>

    </title>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: left;
            background-size: cover;
            height: 95vh;
        }

        .Emfo {
            margin-left: 130px;
            align-items: center;
            border: 1px solid;
            border: rgba(255, 255, 255, 0.3);
            background-color: #ffffff62;
            display: flex;
            flex-direction: column;
            justify-content: top;
            width: 30%;
            height: 55%;
            border-radius: 7px;
            box-shadow: 0 2px 5px rgba(1, 0, 0, 0.5);
            backdrop-filter: blur(13px);
            flex-shrink: 0;
            padding: 10px;

        }

        .lab {
            font-size: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: 600;
            margin-bottom: 3px;
            margin-top: 2px;
            padding: 7px;
            align-self: flex-start;
            margin-left: 18%;
        }

        .in {
            padding: 10px;
            width: 50%;
            margin-bottom: 15px;
            margin-left: 18%;
        }

        .paras {
            justify-content: top;
            margin-top: 15px;
            margin-bottom: 5px;
            align-self: flex-start;
            margin-left: 18%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 2px;
            font-style: bold;
        }

        .pa2 {
            margin: 0px;
            justify-content: top;
            align-items: left;
            margin-bottom: 15px;
            align-self: flex-start;
            margin-left: 18%;
            margin-bottom: 35px;
        }

        .bt {
            margin-top: 20px;
            width: 50%;
            padding: 7px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            border-radius: 5px;
            border: none;
            background-color: rgba(21, 183, 132, 0.914);
            color: white;
        }
    </style>
</head>

<body>
    <div class="Emfo">
        <div class="paras">
            OTP Verification<br>
        </div>
        <div class="pa2">Enter your email authentication</div>
        <label for="user-email" class="lab">Email :</label>
        <input type="email" placeholder="Enter Your Email Address" id="email" class="in">

        <label for="otp" class="lab">Enter OTP :</label>
        <input type="text" placeholder="Enter OTP" class="in" id="otp">
        <button type="button" class="bt" id="mainBtn" onclick="handleAction()">SUBMIT</button>
    </div>

    <script>
        let isOtpSent = false;
        async function handleAction() {
            const emailInput = document.getElementById('email').value;
            const otpInput = document.getElementById('otp').value;
            const mainBtn = document.getElementById('mainBtn');

            if (isOtpSent === False) {
                if (emailInput === "") {
                    alert("Please enter your email address.");
                    return;
                }
                mainBtn.innerText = "Sending OTP...";
                mainBtn.disabled = true;

                try {
                    const response = await fetch('/send-otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: emailInput })

                    });
                    const data = await response.json();
                    if (response.ok) {
                        alert("OTP sent to your email. Please check your inbox.");
                        mainBtn.innerText = "Verify OTP";
                        mainBtn.disabled = false;
                        isOtpSent = true;
                    } else {
                        alert("Error:" + data.error);
                        mainBtn.innerText = "SUBMIT";
                        mainBtn.disabled = false;
                    }
                } catch (error) {
                    alert("Server Connection Failed!");
                    mainBtn.innerText = "SUBMIT";
                    mainBtn.disabled = false;
                }
            }

            else {
                if (otpInput === "") {
                    alert("Please enter the OTP.");
                    return;
                }
                alert("Verifying OTP...");
            }
        }




    </script>

</body>
