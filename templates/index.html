<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Form</title>
    <link rel="icon" type="image/png" href="{{url_for('static', filename='web_favicon.png') }}">
    <style>
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }


        .page-body {
            background-image: url("{{url_for('static', filename='back.png') }}");
            background-size: cover;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            /* Content ko center karne ke liye */
            align-items: center;
            height: 95vh;
            font-weight: 600;
            margin: 0;
        }

        /* Form ka design yahan hai */
        .order-form {
            margin-top: 40px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            width: 35%;
            height: 85%;
            border: rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 15px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* 'top' ki jagah sahi flexbox property use ki hai */
            background-color: #ffffff62;
            box-shadow: 0 2px 5px rgba(1, 0, 0, 0.5);
            backdrop-filter: blur(13px);
            flex-shrink: 0;
        }


        /* Text/Labels ke liye thodi spacing */
        .form-label {
            margin-top: 5px;

        }

        .sub {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .sub:hover {
            background-color: #45a049;
        }

        .sub:active {
            background-color: #2b23c5cd;
        }

        .form-input {
            width: 70%;
            margin: 10px;
            padding: 12px;
            box-sizing: border-box;
            border: 1.8px solid #b8b0b06a;
            border-radius: 5px;
            transition: 0.4s;
            outline: none;
        }

        .form-input:focus {
            border-color: green;
            box-shadow: 0 0 5px rgba(23, 12, 236, 0.605);

        }

        .result {
            height: 50px;
            width: 30%;
            display: none;
            border: 2px solid rgb(25, 11, 222);
            margin-top: 10px;
            border-radius: 8px;
            justify-content: center;
            align-items: center;
            padding: 0;
        }

        #result_text {
            margin: 3px;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;


        }



        .Emfo {
            position: absolute;
            top: 17%;
            left: 8%;
            align-items: center;
            border-left: 5px solid;
            display: flex;
            flex-direction: column;
            justify-content: top;
            width: 80%;
            height: 55%;
            border-radius: 7px;
            box-shadow: 0 2px 5px rgba(1, 0, 0, 0.5);
            backdrop-filter: blur(13px);
            flex-shrink: 0;
            padding: 10px;

        }

        .lab {
            font-size: 16px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: 600;
            margin-bottom: 3px;
            margin-top: 2px;
            padding: 7px;
            align-self: flex-start;
            margin-left: 10%;
        }

        .in {
            padding: 12px;
            width: 20%;
            margin-bottom: 15px;
            margin-left: 10%;
            align-self: flex-start;
            outline: none;
            border-radius: 8px;
            border: 1.8px solid #b8b0b06a;
            transition: 0.4s;

        }

        .in:focus {
            border-color: green;
            box-shadow: 0 0 5px rgba(23, 12, 236, 0.605);

        }

        .paras {
            justify-content: top;
            margin-top: 5px;
            margin-bottom: 5px;
            align-self: flex-start;
            margin-left: 10%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
            font-style: bold;
            color: rgb(26, 164, 164);
        }

        .pa2 {
            margin: 0px;
            justify-content: top;
            align-items: left;
            margin-bottom: 15px;
            align-self: flex-start;
            margin-left: 10%;
            margin-bottom: 35px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .bt {
            margin-top: 20px;
            width: 20%;
            padding: 7px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            border-radius: 5px;
            border: none;
            background-color: rgba(21, 183, 132, 0.914);
            color: white;
            align-self: flex-start;
            margin-left: 10%;
        }



        /* Responsive design for smaller screens */
        @media screen and (max-width: 768px) {
            .order-form {
                width: 85%;
                padding: 6px;
                height: 75%;
                backdrop-filter: blur(12px);

            }

            .page-body {
                font-size: 14px;
                background-image: url("{{url_for('static', filename='mobile_bg.png') }}");
                background-size: contain;
            }

            .form-input {
                width: 90%;
                padding: 10px;
            }

            .sub {
                padding: 8px 16px;
            }

            .result {
                font-size: 16px;
                font-weight: 600;
                width: 90%;
                padding: 0px;
                margin-top: 20px;
                border: 1px solid blue;
                backdrop-filter: blur(20px);
                display: none;
            }

            .Emfo {
                position: absolute;
                top: 17%;
                left: 8%;
                align-items: center;
                border-top: 5px solid;
                display: flex;
                flex-direction: column;
                justify-content: top;
                width: 80%;
                height: 55%;
                border-radius: 7px;
                box-shadow: 0 2px 5px rgba(1, 0, 0, 0.5);
                backdrop-filter: blur(13px);
                flex-shrink: 0;
                padding: 10px;
                border-left: none;
            }


            .in {
                padding: 12px;
                width: 70%;
                margin-bottom: 15px;
                margin-left: 10%;
                align-self: flex-start;
                outline: none;
                border-radius: 8px;
                border: 1.8px solid #b8b0b06a;
                transition: 0.4s;

            }

            .bt {
                margin-top: 20px;
                width: 30%;
                padding: 7px;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                border-radius: 5px;
                border: none;
                background-color: rgba(21, 183, 132, 0.914);
                color: white;
                align-self: flex-start;
                margin-left: 35%;
            }


        }
    </style>
</head>

<body class="page-body">

    <form id="predictionForm" class="order-form">

        <label>Mobile OTP Verification</label>
        <select name="Is_Verified_Mobile" required class="form-input">
            <option value="" selected>Select Verification Status</option>
            <option value="True">Yes (Verified)</option>
            <option value="False">No (Not Verified)</option>
        </select>

        <label class="form-label" for="item1">Mobile No.</label>
        <input type="tel" maxlength="10" pattern="[0-9]{10}" id="item4" name="mobile_no" class="form-input"
            placeholder="Enter Mobile No." title="Please enter 10 digit mobile no." required>


        <label for="Payment_Type:" class="form-label">Payment Type</label>
        <select type="Payment_Type" id="item2" name="Payment_Type" class="form-input" required>
            <option value="" selected>Select Payment Type</option>
            <option value="COD">COD</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Debit Card">Debit Card</option>
            <option value="UPI">UPI</option>
            <option value="Net Banking">Net Banking</option>
        </select>


        <label class="form-label" for="item3" id="item2">Cancellation History</label>
        <input type="number" id="item2" name="Return_Count" class="form-input" placeholder="Enter Cancellation History"
            required>


        <label class="form-label" for="item4">Order Amount</label>
        <input type="number" id="item3" name="Order_Value" class="form-input" placeholder="Enter Order Amount" required>



        <label class="form-label" for="city" id="item5">City</label>
        <select type=" City" name="City_Tier" class="form-input" required>
            <option value="" selected>Select City Type</option>
            <option value="Metro City">Metro City</option>
            <option value="Urban">Urban</option>
            <option value="Rural">Rural</option>
        </select>

        <input type="submit" value="Submit" class="sub">

    </form>

    <div class="result" id="rslt">
        <p id="result_text"></p>
    </div>




    <div class="Emfo">
        <div class="paras">
            OTP Verification<br>
        </div>
        <div class="pa2">Enter your email authentication</div>
        <label for="user-email" class="lab">Email :</label>
        <input type="email" placeholder="Enter Your Email Address" id="email" class="in">

        <label for="otp" class="lab">Enter OTP :</label>
        <input type="text" placeholder="Enter OTP" class="in" id="otp">
        <button type="button" class="bt" id="mainBtn" onclick="handleAction()">SUBMIT</button>
    </div>

    <script>
        let isOtpSent = false;

        async function handleAction() {
            const emailInput = document.getElementById('email').value;
            const otpInput = document.getElementById('otp').value;
            const mainBtn = document.getElementById('mainBtn');

            if (isOtpSent === false) {
                if (emailInput === "") {
                    alert("Please enter your email address.");
                    return;
                }

                mainBtn.innerText = "Sending OTP...";
                mainBtn.disabled = true;

                try {
                    const response = await fetch('/send_otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: emailInput })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert("OTP sent to your email. Please check your inbox.");
                        mainBtn.innerText = "Verify OTP";
                        mainBtn.disabled = false;
                        isOtpSent = true;
                    } else {
                        alert("Error: " + data.error);
                        mainBtn.innerText = "SUBMIT";
                        mainBtn.disabled = false;
                    }
                } catch (error) {
                    alert("Server Connection Failed!");
                    mainBtn.innerText = "SUBMIT";
                    mainBtn.disabled = false;
                }
            }
            else {
                if (otpInput === "") {
                    alert("Please enter the OTP.");
                    return;
                }

                mainBtn.innerText = "Verifying...";
                mainBtn.disabled = true;

                try {
                    const response = await fetch('/verify_otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: emailInput, otp: otpInput })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert("Email Verified Successfully!");

                        const emfoForm = document.querySelector('.Emfo');
                        const predForm = document.getElementById('predictionForm');
                        const rslt = document.getElementById('rslt');

                        emfoForm.style.transition = "opacity 0.5s ease";
                        emfoForm.style.opacity = "0";

                        setTimeout(() => {
                            emfoForm.style.display = "none";

                            predForm.style.opacity = "0";
                            predForm.style.display = "flex";
                            predForm.style.transition = "opacity 0.5s ease";

                            rslt.style.opacity = "0";
                            rslt.style.display = "flex";
                            rslt.style.transition = "opacity 0.5s ease";

                            setTimeout(() => {
                                predForm.style.opacity = "1";
                                rslt.style.opacity = "1";
                            }, 50);

                        }, 500);

                    } else {
                        alert("Incorrect OTP: " + data.error);
                        mainBtn.innerText = "Verify OTP";
                        mainBtn.disabled = false;
                    }
                } catch (error) {
                    alert("Verification Server Error!");
                    mainBtn.innerText = "Verify OTP";
                    mainBtn.disabled = false;
                }
            }
        }





        document.getElementById('predictionForm').addEventListener('submit', function (event) {
            event.preventDefault();
            var formData = new FormData(this);
            fetch('/predict', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result_text').textContent = data.prediction_text;
                    document.getElementById('predictionForm').reset(); // Form reset after submission

                    let resultPara = document.getElementById('result_text');
                    resultPara.style.opacity = 0;
                    setTimeout(() => {
                        resultPara.innerHTML = data.prediction_text;
                        resultPara.style.opacity = 1;
                    }, 300);
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });
    </script>
</body>

</html>
